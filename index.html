  <body>
    <!--
      The intro loader, in static HTML so it paints before any JS runs. Words start hidden
      (exactly where the loader's intro tween starts them); src/components/Loader.tsx adopts
      this element and animates it.
    -->
    <div class="loader loader--boot" id="boot-loader" aria-hidden="true">
      <div class="loader__top">
        <span class="loader__mask"><span class="loader__word">Alireza Afshar</span></span>
        <span class="loader__mask"><span class="loader__word" data-loader-year>Portfolio ©2026</span></span>
      </div>
      <div class="loader__bottom">
        <span class="loader__mask"><span class="loader__word">Motion · 3D · Product UI</span></span>
        <span class="loader__mask"><span class="loader__count">000</span></span>
      </div>
      <span class="loader__bar"></span>
    </div>
    <script>
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
        document.getElementById('boot-loader').remove()
        document.documentElement.classList.remove('is-loading')
      }
    </script>
    <noscript><style>#boot-loader { display: none; } html.is-loading { overflow: visible; }</style></noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
